[project]
name = "sdp-control"
version = "0.1.0"
description = "Control system for the SKAO SDP exercise"
authors = [
    {name = "Emma Alexander", email = "emma.alexander@gmail.com"}
]
requires-python = ">=3.10,<4.0"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "ruff (>=0.16.8,<0.17.0)",
]

[tool.poetry]
packages = [
    {include = "sdp_control", from = "src"}
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]